name: WordPress integration tests

on:
  push:
    branches:
      - feature/2.4.0-ua-improvements
  pull_request:
  workflow_dispatch:

jobs:
  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, mysqli, zip
      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      - name: Install WordPress
        run: |
          wp core download --path=wordpress --allow-root
          wp config create --path=wordpress --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --path=wordpress --url=http://localhost --title="UA Web Finder CI" --admin_user=admin --admin_password=password --admin_email=admin@example.test --allow-root
      - name: Install plugin into the real target directory
        run: |
          mkdir -p wordpress/wp-content/plugins/cms-web-finder
          cp cms-web-finder.php README.md wordpress/wp-content/plugins/cms-web-finder/
          cp -R includes assets wordpress/wp-content/plugins/cms-web-finder/
      - name: Prepare legacy data and activate plugin
        run: |
          wp eval 'update_option("cms_checker_results", [["url"=>"https://legacy.example.ua","cms"=>"Joomla","version"=>"3.10.12","status"=>"200","email"=>"info@legacy.example.ua"]]); update_option("cms_checker_notes", ["https://legacy.example.ua"=>"legacy note"]); update_option("cms_checker_template", "Legacy template body");' --path=wordpress --allow-root
          wp plugin activate cms-web-finder --path=wordpress --allow-root
      - name: Verify migration, lists, filters, detection, and data persistence
        run: |
          wp eval '
          global $wpdb;
          $fail = function($message) { fwrite(STDERR, $message . PHP_EOL); exit(1); };
          if (!get_option("cmsf_migrated")) $fail("Legacy migration flag missing");
          $legacy = $wpdb->get_row("SELECT * FROM " . cmsf_t("sites") . " WHERE domain=\"legacy.example.ua\"", ARRAY_A);
          if (!$legacy || $legacy["note"] !== "[22.11.2026 00:00] legacy note" && strpos($legacy["note"], "legacy note") === false) $fail("Legacy site or note was not migrated");
          if (!cmsf_templates_all()) $fail("Template table was not seeded/migrated");
          $a = cmsf_list_create("Integration A", []);
          $b = cmsf_list_create("Integration B", []);
          if (cmsf_add_queued($a, ["shared.example.ua"]) !== 1) $fail("First list insert failed");
          if (cmsf_add_queued($b, ["shared.example.ua"]) !== 1) $fail("Cross-list domain insert failed");
          $wpdb->update(cmsf_t("sites"), ["state"=>"ok","version"=>"5.9.0","note"=>"[22.11.2026 00:00] shared note"], ["domain"=>"shared.example.ua"]);
          $notes = $wpdb->get_col($wpdb->prepare("SELECT note FROM " . cmsf_t("sites") . " WHERE domain=%s", "shared.example.ua"));
          if (count($notes) !== 2 || count(array_unique($notes)) !== 1) $fail("Shared notes across lists failed");
          list($where, $args) = cmsf_where($a, ["state"=>"all","notes"=>"with","version_min"=>"1.5","version_max"=>"6.00"]);
          $count = (int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM " . cmsf_t("sites") . " WHERE " . $where, $args));
          if ($count !== 1) $fail("Version range / notes filter failed");
          if (!cmsf_is_ua_domain("shop.in.ua") || !cmsf_is_ua_domain("site.kyiv.ua") || !cmsf_is_ua_domain("site.укр")) $fail("UA domain suffix detection failed");
          $langs = cmsf_detect_langs("<html><body></body></html>", "Ми пропонуємо якісні меблі, вироби та послуги для вашого дому і родини.");
          if (!in_array("uk", $langs, true)) $fail("Ukrainian language fallback failed");
          if (cmsf_detect_cms("<html><script src=\"/wp-includes/js/jquery.js\"></script><link href=\"/wp-content/themes/test/style.css\"></html>") !== "WordPress") $fail("WordPress detection failed");
          if (cmsf_detect_cms("<html><script src=\"/media/system/js/core.js\"></script></html>") !== "Joomla") $fail("Joomla detection failed");
          $contacts = cmsf_extract_contacts("<a href=\"mailto:one@example.ua\">one</a><p>two@example.ua</p>", "two@example.ua");
          if (count($contacts["emails"]) !== 2) $fail("Multiple email extraction failed");
          ' --path=wordpress --allow-root
          wp plugin deactivate cms-web-finder --path=wordpress --allow-root
          wp plugin activate cms-web-finder --path=wordpress --allow-root
          wp eval 'global $wpdb; $n=(int)$wpdb->get_var("SELECT COUNT(*) FROM " . cmsf_t("sites") . " WHERE domain=\"shared.example.ua\""); if ($n !== 2) { fwrite(STDERR, "Data lost after deactivate/activate" . PHP_EOL); exit(1); }' --path=wordpress --allow-root
