name: WordPress integration tests

on:
  push:
    branches:
      - feature/2.4.0-ua-improvements
  pull_request:
  workflow_dispatch:

jobs:
  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, mysqli, zip
      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      - name: Install WordPress
        run: |
          wp core download --path=wordpress --allow-root
          wp config create --path=wordpress --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --path=wordpress --url=http://localhost --title="UA Web Finder CI" --admin_user=admin --admin_password=password --admin_email=admin@example.test --allow-root
      - name: Install plugin into the real target directory
        run: |
          mkdir -p wordpress/wp-content/plugins/cms-web-finder
          cp cms-web-finder.php README.md wordpress/wp-content/plugins/cms-web-finder/
          cp -R includes assets wordpress/wp-content/plugins/cms-web-finder/
      - name: Prepare legacy data and activate plugin
        run: |
          wp eval 'update_option("cms_checker_results", [["url"=>"https://legacy.example.ua","cms"=>"Joomla","version"=>"3.10.12","status"=>"200","email"=>"info@legacy.example.ua"]]); update_option("cms_checker_notes", ["https://legacy.example.ua"=>"legacy note"]); update_option("cms_checker_template", "Legacy template body");' --path=wordpress --allow-root
          wp plugin activate cms-web-finder --path=wordpress --allow-root
      - name: Verify migration, lists, filters, detection, and data persistence
        run: |
          wp eval-file tests/integration.php --path=wordpress --allow-root
          wp plugin deactivate cms-web-finder --path=wordpress --allow-root
          wp plugin activate cms-web-finder --path=wordpress --allow-root
          wp eval 'global $wpdb; $n=(int)$wpdb->get_var("SELECT COUNT(*) FROM " . cmsf_t("sites") . " WHERE domain=\"shared.example.ua\""); if ($n !== 2) { fwrite(STDERR, "Data lost after deactivate/activate" . PHP_EOL); exit(1); }' --path=wordpress --allow-root
